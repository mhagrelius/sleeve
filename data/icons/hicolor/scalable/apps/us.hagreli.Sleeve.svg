<?xml version="1.0" encoding="UTF-8"?>
<!-- A record half out of its sleeve. The disc is the thing you get; the sleeve
     is how you recognise which pressing it is, which is the application in one
     picture. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="1" stop-color="#deddda"/>
    </linearGradient>
    <linearGradient id="vinyl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3846"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
  </defs>

  <!-- The disc, sliding out to the right. -->
  <g transform="translate(74 64)">
    <circle r="38" fill="url(#vinyl)"/>
    <circle r="30" fill="none" stroke="#5e5c64" stroke-width="1" opacity="0.6"/>
    <circle r="24" fill="none" stroke="#5e5c64" stroke-width="1" opacity="0.6"/>
    <circle r="18" fill="none" stroke="#5e5c64" stroke-width="1" opacity="0.6"/>
    <circle r="12" fill="#e66100"/>
    <circle r="3" fill="#f6f5f4"/>
  </g>

  <!-- The sleeve in front of it. -->
  <rect x="12" y="20" width="80" height="88" rx="4" fill="url(#card)" stroke="#9a9996" stroke-width="2"/>
  <rect x="22" y="30" width="60" height="60" rx="2" fill="#1c71d8"/>
  <circle cx="52" cy="60" r="17" fill="none" stroke="#f6f5f4" stroke-width="3" opacity="0.85"/>
  <circle cx="52" cy="60" r="4" fill="#f6f5f4" opacity="0.85"/>
</svg>
