# Flatpak manifest for Sleeve.
#
# A straightforward one, because Sleeve runs nothing. It is a GTK application
# that makes HTTP requests and writes a SQLite file — no host binaries, no
# bundled tools, nothing to shell out to. The sandbox costs it nothing.
#
# Build:  packaging/build-flatpak.sh

id: us.hagreli.Sleeve

# GNOME 50: the first runtime carrying libadwaita 1.9, which this is compiled
# against, and GTK 4.22. GTK must be at least 4.16 for the CSS custom properties
# the stylesheet uses. libsoup and libsqlite3 are both in the runtime, which is
# why those two dependencies cost nothing here.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: sleeve

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Unavoidable: every answer this application gives comes from a shop's API.
  - --share=network

  # Deliberately absent:
  #   --filesystem=*   Sleeve reads and writes nothing outside its own config
  #                    and cache directories, which the sandbox provides.
  #   --talk-name=*    it has nothing to say to any other process.
  #   --device=all     nothing here touches hardware.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/sleeve/cargo
  # No --share=network build-arg: Flathub builds with the network off, and
  # cargo-sources.json supplies every crate with a checksum, so it is not
  # needed. Adding it back would make this unacceptable for submission.

modules:
  - name: sleeve
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - install -Dm755 target/release/sleeve /app/bin/sleeve
      - install -Dm644 data/us.hagreli.Sleeve.desktop
        /app/share/applications/us.hagreli.Sleeve.desktop
      - install -Dm644 data/us.hagreli.Sleeve.metainfo.xml
        /app/share/metainfo/us.hagreli.Sleeve.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/us.hagreli.Sleeve.svg
        /app/share/icons/hicolor/scalable/apps/us.hagreli.Sleeve.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/us.hagreli.Sleeve-symbolic.svg
        /app/share/icons/hicolor/symbolic/apps/us.hagreli.Sleeve-symbolic.svg
    sources:
      - type: dir
        path: ../..
      # Generated by build-flatpak.sh from Cargo.lock, so an offline builder
      # reproduces the same tree and a changed crate fails the build.
      - cargo-sources.json
